sources:
  # Warsaw and Winona Lake come first. These calendars intentionally include
  # classes, markets, family programs, performances, and other everyday events.
  - name: Warsaw Community Public Library
    url: https://warsaw.librarycalendar.com/events/list
    reliability: official
    distance_miles: 0
    city: Warsaw
    state: IN
    venue: Warsaw Community Public Library
    address: 310 East Main Street
    comprehensive: true
    pagination_pages: 6
    selectors:
      event_block: article.event-card
      title: h2 .lc-event__link
      date: .lc-list-event-info-item--date
      venue: .lc-list-event-location
      description: .lc-list-event-description

  - name: Downtown Warsaw
    url: https://downtownwarsaw.com/events/
    reliability: official
    distance_miles: 0
    city: Warsaw
    state: IN
    venue: Downtown Warsaw
    comprehensive: true
    selectors:
      event_block: a.cards-kind-event
      title: .cards-header
      date: .cards-icon-meta

  - name: Warsaw events index
    url: https://allevents.in/warsaw-in/all
    reliability: aggregator
    distance_miles: 0
    city: Warsaw
    state: IN
    comprehensive: true

  - name: Winona Lake events index
    url: https://allevents.in/winona-lake/all
    reliability: aggregator
    distance_miles: 3
    city: Winona Lake
    state: IN
    comprehensive: true

  - name: The Village at Winona
    url: https://villageatwinona.com/events/
    reliability: official
    distance_miles: 3
    city: Winona Lake
    state: IN
    venue: The Village at Winona
    comprehensive: true
    extractor: linked
    link_selector: "a[href*='/events/']"
    detail_selectors:
      title: h2
      date: h1.p1
      description: article p

  - name: Times-Union
    url: https://timesuniononline.com/
    reliability: news
    distance_miles: 0
    highlights_only: true
  - name: InkFreeNews
    url: https://www.inkfreenews.com/
    reliability: news
    distance_miles: 0
    highlights_only: true
  - name: News Now Warsaw
    url: https://www.newsnowwarsaw.com/
