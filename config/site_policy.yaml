site_identity:
  name: Kosciusko Community Calendar
  family_friendly_default: true
  christian_informed_values:
    - truthfulness
    - human_dignity
    - family
    - service
    - stewardship
    - responsibility
    - neighborliness
  editorial_decisions_based_on:
    - event_content
    - age_suitability
    - source_credibility
    - legality
    - local_relevance
    - safety
  exclude_based_only_on_personal_identity: false

editorial_scope:
  family_faith_service_civic_and_general_community_events: include
  sexuality_or_gender_identity_advocacy_events_all_viewpoints: outside_scope
  organizer_performer_or_attendee_identity_alone: never_a_rejection_reason
  political_or_ideological_advocacy_requires_local_public_interest_review: true

advertising:
  third_party_ad_networks: false
  behavioral_analytics: false
  affiliate_tracking: false

sponsored_events:
  enabled: false
  default_visible: false
  visitor_can_hide: true
  required_label: Sponsored
  affects_organic_ranking: false
  maximum_per_20_organic_events: 1
  requires_manual_approval: true
  expires_after_event: true

submissions:
  current_intake_mode: public_github_issue_prototype
  production_intake_required: private_quarantine_queue
  automatic_publication: false
  requires_manual_approval: true
  verify_source: true
  check_duplicates: true
  scan_url_safety: true
  classify_age_restriction: true
  classify_content_safety: true

content_policy:
  all_ages_events: allow_after_verification
  lawful_13_plus_events: allow_with_age_label
  lawful_18_plus_events: manual_review_and_hidden_by_default
  lawful_21_plus_nightlife: allow_with_age_label
  adult_entertainment_or_sexually_explicit_performances: reject
  pornography_or_graphic_sexual_material: reject
  malware_or_phishing: reject
  scams_or_illegal_activity: reject
  hate_or_extremist_events: reject
  targeted_harassment_or_credible_violence: reject
  weapons_or_illegal_drug_sales: reject
  gambling_promotions: manual_review
  identity_specific_events: evaluate_under_same_content_age_source_and_safety_rules
