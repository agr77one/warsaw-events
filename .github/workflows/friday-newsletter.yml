name: Friday Newsletter

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warsaw-events-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline.py --mode friday
      - name: Commit newsletter, portal, and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.db output/ docs/index.html
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: publish Friday event update"
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: friday-newsletter
          path: |
            output/
            data/events.db
            docs/index.html
          retention-days: 90
