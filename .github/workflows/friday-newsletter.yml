name: Friday Newsletter

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warsaw-events-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - name: Copy report as weekly newsletter baseline
        run: cp output/run_report.md output/weekly_newsletter.md
      - name: Commit newsletter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: publish Friday event update"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: friday-newsletter
          path: output/
          retention-days: 90
