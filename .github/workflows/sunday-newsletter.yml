name: Sunday Newsletter

on:
  schedule:
    - cron: "0 9 * * 0"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the newsletter email during this manual run
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: warsaw-events-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and send scheduled newsletter
        if: github.event_name == 'schedule' || inputs.send_email
        run: python pipeline.py --mode newsletter
      - name: Generate manual test without sending email
        if: github.event_name == 'workflow_dispatch' && !inputs.send_email
        run: python pipeline.py --mode daily
      - name: Commit newsletter, portal, and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.db output/ docs/index.html
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: publish Sunday event update"
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: sunday-newsletter
          path: |
            output/
            data/events.db
            docs/index.html
          retention-days: 30
