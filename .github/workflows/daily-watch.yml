name: Daily Event Watch

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warsaw-events-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline.py --mode daily
      - name: Commit database, portal, and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.db output/ docs/index.html
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "chore: update daily event scan"
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: daily-event-output
          path: |
            output/
            data/events.db
            docs/index.html
          retention-days: 7
